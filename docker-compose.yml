version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pasalo-db
    environment:
      POSTGRES_USER: ${DB_USER:-pasalo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pasalo_dev}
      POSTGRES_DB: ${DB_NAME:-pasalo_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasalo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pasalo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pasalo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pasalo-network

  # NestJS Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pasalo-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pasalo:pasalo_dev@postgres:5432/pasalo_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      CORS_ORIGIN: http://localhost:3001
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    networks:
      - pasalo-network
    command: npm run start:dev

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pasalo-frontend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_APP_NAME: PASALO OS
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - pasalo-network
    command: npm run dev

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: pasalo-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pasalo-network

volumes:
  postgres_data:
    driver: local

networks:
  pasalo-network:
    driver: bridge
