version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pasalo-db
    environment:
      POSTGRES_USER: ${DB_USER:-pasalo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pasalo_dev}
      POSTGRES_DB: ${DB_NAME:-pasalo_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pasalo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pasalo-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pasalo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pasalo-network

volumes:
  postgres_data:
    driver: local

networks:
  pasalo-network:
    driver: bridge
