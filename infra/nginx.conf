upstream backend {
  server backend:3000;
}

upstream frontend {
  server frontend:3001;
}

# The outer trusted proxy must replace client-supplied forwarding headers.
# Collapse its forwarded chain to the original client address so Express can
# safely trust exactly this Nginx hop (TRUST_PROXY_HOPS=1).
map $http_x_forwarded_for $pasalo_client_ip {
  default $remote_addr;
  "~^\\s*([^,]+)" $1;
}

server {
  listen 80;
  server_name _;

  # Keep this listener private to the single trusted TLS proxy, which must
  # replace client-supplied X-Forwarded-* headers before forwarding requests.

  client_max_body_size 10M;

  # Backend API
  location /api {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pasalo_client_ip;
    proxy_set_header X-Forwarded-For $pasalo_client_ip;
    # Preserve the protocol from the outer TLS proxy; this Nginx hop is HTTP.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # Frontend
  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pasalo_client_ip;
    proxy_set_header X-Forwarded-For $pasalo_client_ip;
    # Preserve the protocol from the outer TLS proxy; this Nginx hop is HTTP.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_cache_bypass $http_upgrade;
  }

  # Health check endpoint
  location /health {
    proxy_pass http://backend/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
