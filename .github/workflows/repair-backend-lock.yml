name: Repair Backend Lockfile

on:
  push:
    branches:
      - feat/blinkit-commerce-p0-foundation
    paths:
      - '.github/workflows/repair-backend-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/blinkit-commerce-p0-foundation
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "chore: regenerate backend lockfile"
          git push origin HEAD:feat/blinkit-commerce-p0-foundation
