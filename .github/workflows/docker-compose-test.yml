name: Docker Compose Test

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-compose-test.yml'
  pull_request:
    branches: [main, develop]

jobs:
  test-compose:
    runs-on: ubuntu-latest
    env:
      DB_USER: pasalo
      DB_PASSWORD: pasalo_test
      DB_NAME: pasalo_test
      DATABASE_URL: postgresql://pasalo:pasalo_test@postgres:5432/pasalo_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      TRUST_PROXY_HOPS: '1'
      CORS_ORIGIN: http://localhost:3001
      STORE_SYNC_WEBHOOK_URL: http://host.docker.internal:3999/test
      STORE_SYNC_WEBHOOK_SECRET: ci-only-store-sync-secret
      PASALO_INTEGRATION_SECRET: ci-only-integration-secret
      CEO_ONLINE_ORDER_URL: http://host.docker.internal:3999/test
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Start Docker Compose stack
        run: docker compose --profile development up -d --build
      - name: Wait for services
        run: |
          echo "Waiting for backend container..."
          timeout 120 bash -c 'until [ "$(docker inspect -f "{{.State.Status}}" pasalo-backend 2>/dev/null)" = "running" ]; do sleep 2; done'
          echo "Waiting for frontend..."
          timeout 120 bash -c 'until curl -fsS http://localhost:3001; do sleep 2; done'
      - name: Check services status
        run: docker compose --profile development ps
      - name: View logs
        if: failure()
        run: docker compose --profile development logs
      - name: Stop Docker Compose
        if: always()
        run: docker compose --profile development down -v
